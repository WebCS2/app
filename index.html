<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Minecraft 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #000;
      font-family: sans-serif;
      user-select: none;
    }
    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      pointer-events: none;
      z-index: 9;
    }
    #crosshair:before, #crosshair:after {
      content: "";
      position: absolute;
      background: white;
    }
    #crosshair:before {
      left: 7px;
      top: 0;
      width: 2px;
      height: 16px;
    }
    #crosshair:after {
      top: 7px;
      left: 0;
      width: 16px;
      height: 2px;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="info">
    Click to lock mouse<br>
    WASD: move &nbsp; Space: jump &nbsp; Shift: sprint<br>
    Left click: break block &nbsp; Right click: place block<br>
  </div>
  <div id="crosshair"></div>

  <!-- Three.js + PointerLockControls (matching versions) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/PointerLockControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let canJump = false;
    const objects = [];
    const clock = new THREE.Clock();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 5, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(-50, 100, -50);
      scene.add(dirLight);

      controls = new THREE.PointerLockControls(camera, document.body);
      scene.add(controls.getObject()); // important

      document.body.addEventListener('click', () => {
        controls.lock();
      });

      const blockTexture = createBlockTexture('#8B4513', '#A0522D');
      const grassTopTexture = createBlockTexture('#3cb043', '#2e8b57');
      const stoneTexture = createBlockTexture('#777777', '#999999');

      const blockMat = new THREE.MeshLambertMaterial({ map: blockTexture });
      const grassTopMat = new THREE.MeshLambertMaterial({ map: grassTopTexture });
      const stoneMat = new THREE.MeshLambertMaterial({ map: stoneTexture });

      const groundGeo = new THREE.BoxGeometry(200, 1, 200);
      const ground = new THREE.Mesh(groundGeo, stoneMat);
      ground.position.y = -0.5;
      scene.add(ground);
      objects.push(ground);

      const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

      function addBlock(x, y, z, mat) {
        const mesh = new THREE.Mesh(cubeGeo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        objects.push(mesh);
        return mesh;
      }

      for (let x = -10; x <= 10; x++) {
        for (let z = -10; z <= 10; z++) {
          addBlock(x, 0, z, grassTopMat);
        }
      }

      for (let i = 0; i < 80; i++) {
        const x = Math.floor(Math.random() * 16 - 8);
        const z = Math.floor(Math.random() * 16 - 8);
        const h = Math.floor(Math.random() * 3) + 1;
        for (let y = 1; y <= h; y++) {
          addBlock(x, y, z, blockMat);
        }
      }

      const keys = {
        forward: false,
        backward: false,
        left: false,
        right: false,
        sprint: false
      };

      document.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': keys.forward = true; break;
          case 'KeyS': keys.backward = true; break;
          case 'KeyA': keys.left = true; break;
          case 'KeyD': keys.right = true; break;
          case 'Space':
            if (canJump === true) {
              velocity.y += 8;
              canJump = false;
            }
            break;
          case 'ShiftLeft':
          case 'ShiftRight':
            keys.sprint = true;
            break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': keys.forward = false; break;
          case 'KeyS': keys.backward = false; break;
          case 'KeyA': keys.left = false; break;
          case 'KeyD': keys.right = false; break;
          case 'ShiftLeft':
          case 'ShiftRight':
            keys.sprint = false;
            break;
        }
      });

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(0, 0);

      document.addEventListener('mousedown', (e) => {
        if (!controls.isLocked) return;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, false);

        if (intersects.length > 0) {
          const hit = intersects[0].object;

          if (e.button === 0) {
            if (hit !== ground) {
              scene.remove(hit);
              const idx = objects.indexOf(hit);
              if (idx !== -1) objects.splice(idx, 1);
            }
          } else if (e.button === 2) {
            const normal = intersects[0].face.normal.clone();
            const pos = hit.position.clone().add(normal);
            pos.x = Math.round(pos.x);
            pos.y = Math.round(pos.y);
            pos.z = Math.round(pos.z);
            addBlock(pos.x, pos.y, pos.z, blockMat);
          }
        }
      });

      window.addEventListener('contextmenu', (e) => e.preventDefault());

      function update() {
        const delta = clock.getDelta();
        const speed = keys.sprint ? 10 : 5;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 20.0 * delta;

        direction.z = Number(keys.forward) - Number(keys.backward);
        direction.x = Number(keys.right) - Number(keys.left);
        direction.normalize();

        if (keys.forward || keys.backward) velocity.z -= direction.z * speed * delta;
        if (keys.left || keys.right) velocity.x -= direction.x * speed * delta;

        if (controls.isLocked) {
          const prevY = controls.getObject().position.y;

          controls.moveRight(-velocity.x * delta);
          controls.moveForward(-velocity.z * delta);
          controls.getObject().position.y += velocity.y * delta;

          if (controls.getObject().position.y < 2) {
            velocity.y = 0;
            controls.getObject().position.y = 2;
            canJump = true;
          }

          const playerPos = controls.getObject().position;
          const playerBox = new THREE.Box3(
            new THREE.Vector3(playerPos.x - 0.3, playerPos.y - 1.7, playerPos.z - 0.3),
            new THREE.Vector3(playerPos.x + 0.3, playerPos.y, playerPos.z + 0.3)
          );

          for (let i = 0; i < objects.length; i++) {
            const obj = objects[i];
            if (obj === ground) continue;
            const box = new THREE.Box3().setFromObject(obj);
            if (box.intersectsBox(playerBox)) {
              controls.getObject().position.y = prevY;
              velocity.y = 0;
              canJump = true;
              break;
            }
          }
        }
      }

      window.updateGame = update;
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (window.updateGame) window.updateGame();
      renderer.render(scene, camera);
    }

    function createBlockTexture(color1, color2) {
      const size = 32;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const pixel = 4;
      for (let y = 0; y < size; y += pixel) {
        for (let x = 0; x < size; x += pixel) {
          const useFirst = ((x + y) / pixel) % 2 === 0;
          ctx.fillStyle = useFirst ? color1 : color2;
          ctx.fillRect(x, y, pixel, pixel);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }
  </script>
</body>
</html>
