<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Game Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050816;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 32px 40px;
      border-radius: 16px;
      background: radial-gradient(circle at top, #1f2937, #020617);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0 0 24px;
      opacity: 0.8;
    }
    button {
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      color: #0b1120;
      background: linear-gradient(135deg, #22c55e, #a3e635);
      box-shadow: 0 10px 25px rgba(34,197,94,0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(34,197,94,0.55);
      filter: brightness(1.05);
    }
    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 16px rgba(34,197,94,0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter the World</h1>
    <p>Click below to jump straight into the game.</p>
    <button id="playBtn">Play Now</button>
  </div>

  <script>
    // Change this to your real domain
    const BASE_DOMAIN = "https://app-silk-psi-67.vercel.app";

    document.getElementById("playBtn").addEventListener("click", () => {
      // This will navigate to /play on your Vercel domain
      window.location.href = BASE_DOMAIN + "/play";
    });
  </script>
</body>
</html>
